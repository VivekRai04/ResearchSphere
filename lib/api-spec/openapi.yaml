          type: integer
        departmentId:
          type: string
        departmentName:
          type: string
        researchArea:
          type: string
        paperType:
          type: string
        doi:
          type: [string, "null"]
        objectPath:
          type: [string, "null"]
        fileHash:
          type: [string, "null"]
        keywords:
          type: array
          items:
            type: string
        status:
