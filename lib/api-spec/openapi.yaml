        - departmentName
        - researchArea
        - paperType
        - doi
        - objectPath
        - fileHash
        - keywords
        - status
        - uploadedById
        - authorName
        - createdAt
        - versionNumber
        - latestReviewComment
        - versions
        - comments
        - citedByCount
    PaperVersion:
