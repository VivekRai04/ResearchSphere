services:
  # API Server (Node.js)
  - type: web
    name: researchsphere-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # You will need to provide this from Neon.tech
      - key: FRONTEND_URL
        value: https://researchsphere-web.onrender.com
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: researchsphere-ai
          envVarKey: RENDER_EXTERNAL_URL

  # Python AI Service
  - type: web
    name: researchsphere-ai
    env: python
    plan: free
    rootDir: artifacts/ai-service
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn main:app -w 1 -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend Web App (Vite React)
  - type: web
    name: researchsphere-web
    env: static
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/research-sphere run build
    staticPublishPath: artifacts/research-sphere/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          type: web
          name: researchsphere-api
          envVarKey: RENDER_EXTERNAL_URL
